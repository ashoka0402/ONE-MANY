name: Verify ONE / MANY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Frontend lint and types
        run: |
          npm run lint:web
          npm run typecheck:web
      - name: Frontend production build
        run: npm run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API
        run: python -m pip install -e "./apps/api[dev]"
      - name: Start PostgreSQL and apply Stage 3 migrations
        env:
          POSTGRES_PASSWORD: validation-only-not-real
          DATABASE_URL: postgresql+psycopg://one_many:validation-only-not-real@127.0.0.1:5432/one_many
        run: |
          docker compose up -d --wait postgres
          cd apps/api
          python -m alembic upgrade head
          cd ../..
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://one_many:validation-only-not-real@127.0.0.1:5432/one_many") as connection:
              assert connection.execute("SELECT to_regclass('public.users')").fetchone()[0] == "users"
              assert connection.execute("SELECT to_regclass('public.needs')").fetchone()[0] == "needs"
              assert connection.execute("SELECT version_num FROM alembic_version").fetchone()[0] == "20261112_03"
              assert connection.execute("SELECT to_regclass('public.need_intents')").fetchone()[0] == "need_intents"
              assert connection.execute("SELECT to_regclass('public.purchase_proposals')").fetchone()[0] == "purchase_proposals"
          PY
          python - <<'PY'
          from fastapi.testclient import TestClient
          from one_many_api.config import Settings
          from one_many_api.main import create_app
          settings = Settings(
              _env_file=None,
              environment="test",
              auth_secret="CI-only-secret-test-value-with-at-least-32-characters",
              database_url="postgresql+psycopg://one_many:validation-only-not-real@127.0.0.1:5432/one_many",
          )
          with TestClient(create_app(settings)) as client:
              signed_up = client.post("/api/v1/auth/register", json={
                  "email": "postgres-smoke@example.com",
                  "display_name": "Database Smoke",
                  "password": "not-a-real-secret-password-123",
              })
              assert signed_up.status_code == 201, signed_up.text
              auth = {"Authorization": "Bearer " + signed_up.json()["access_token"]}
              saved = client.post("/api/v1/needs", headers=auth, json={
                  "request_text": "Need a projector for Friday evening workshop",
              })
              assert saved.status_code == 201, saved.text
              assert client.get("/api/v1/needs", headers=auth).json()["total"] == 1
              from unittest.mock import patch
              from one_many_api.ai_service import AIIntent
              consent = client.patch(
                  "/api/v1/needs/" + saved.json()["id"], headers=auth,
                  json={"discoverable": True},
              )
              assert consent.status_code == 200, consent.text
              second = client.post("/api/v1/auth/register", json={
                  "email": "postgres-peer@example.com",
                  "display_name": "Postgres Peer",
                  "password": "not-a-real-secret-password-123",
              })
              assert second.status_code == 201, second.text
              peer_auth = {"Authorization": "Bearer " + second.json()["access_token"]}
              peer_need = client.post("/api/v1/needs", headers=peer_auth, json={
                  "request_text": "Borrow a projector for a community session",
                  "location_label": "Downtown, Pune",
                  "discoverable": True,
                  "needed_from": "2026-11-20",
                  "needed_until": "2026-11-21",
              })
              assert peer_need.status_code == 201, peer_need.text
              # The original need has no area; update it to match, preserving privacy.
              assert client.patch("/api/v1/needs/" + saved.json()["id"], headers=auth, json={
                  "location_label": "Downtown, Pune",
                  "needed_from": "2026-11-17",
                  "needed_until": "2026-11-18",
              }).status_code == 200
              # A deterministic model fixture is used only in CI (never in production).
              def model_fixture(text, settings):
                  return AIIntent(
                      asset_type="projector", purpose="Project a presentation",
                      required_features=[], excluded_features=[], shareable=True,
                  )
              with patch("one_many_api.discovery_routes.extract_intent", side_effect=model_fixture):
                  for identity, identifier in [(auth, saved.json()["id"]), (peer_auth, peer_need.json()["id"])]:
                      analysis = client.post("/api/v1/needs/" + identifier + "/analyze", headers=identity)
                      assert analysis.status_code == 200, analysis.text
              match = client.get("/api/v1/needs/" + saved.json()["id"] + "/matches", headers=auth)
              assert match.status_code == 200, match.text
              assert match.json()["potential_members"] == 1, match.text
              assert "postgres-peer@example.com" not in match.text
              # Stage 3: provider response fixtures are TEST-ONLY; production never uses them.
              from one_many_api.channel3 import normalize_product
              raw_product = {
                  "id": "ci-sample-projector",
                  "title": "Portable projector",
                  "images": [{"url": "https://images.example.test/projector.jpg"}],
                  "offers": [{
                      "url": "https://shop.example.test/projector",
                      "domain": "shop.example.test",
                      "price": {"price": 97.01, "currency": "USD"},
                      "availability": "InStock",
                  }],
              }
              with patch("one_many_api.catalog_routes.Channel3Client.product") as product_detail:
                  product_detail.return_value = normalize_product(raw_product, "USD", [], [])
                  draft = client.post("/api/v1/needs/" + saved.json()["id"] + "/proposals",
                      headers=auth, json={
                          "product_id": "ci-sample-projector",
                          "offer_url": "https://shop.example.test/projector",
                      })
              assert draft.status_code == 201, draft.text
              assert draft.json()["member_shares_minor"] == [4851, 4850]
              assert draft.json()["price_minor"] == 9701
              assert client.get("/api/v1/proposals", headers=auth).json()["proposals"][0]["id"] == draft.json()["id"]
              assert client.get("/api/v1/proposals", headers=peer_auth).json()["proposals"] == []

          PY
      - name: API tests and lint
        run: |
          python -m pytest -q apps/api/tests
          python -m ruff check apps/api
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: validation-only-not-real
        run: docker compose config --quiet
      - name: Shut down test database
        if: always()
        env:
          POSTGRES_PASSWORD: validation-only-not-real
        run: docker compose down
