name: Verify Stage 0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Frontend lint and types
        run: |
          npm run lint:web
          npm run typecheck:web
      - name: Frontend production build
        run: npm run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API
        run: python -m pip install -e "./apps/api[dev]"
      - name: API tests and lint
        run: |
          python -m pytest -q apps/api/tests
          python -m ruff check apps/api
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: validation-only-not-real
        run: docker compose config --quiet
      - name: Verify PostgreSQL starts and accepts connections
        env:
          POSTGRES_PASSWORD: validation-only-not-real
        run: |
          docker compose up -d --wait postgres
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://one_many:validation-only-not-real@127.0.0.1:5432/one_many") as conn:
              assert conn.execute("SELECT 1").fetchone() == (1,)
          PY
          docker compose down
