name: Verify Stage 0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Reconcile interrupted npm installation lockfile
        run: |
          npm install --prefix apps/web --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- apps/web/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/package-lock.json
            git commit -m "chore(stage-0): sync frontend dependency lockfile"
            git push origin HEAD:main
          fi
      - name: Install frontend
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Frontend lint and types
        run: |
          npm run lint:web
          npm run typecheck:web
      - name: Frontend production build
        run: npm run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API
        run: python -m pip install -e "./apps/api[dev]"
      - name: API tests and lint
        run: |
          python -m pytest -q apps/api/tests
          python -m ruff check apps/api
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: validation-only-not-real
        run: docker compose config --quiet
