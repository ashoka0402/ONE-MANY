name: Verify ONE / MANY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Frontend lint and types
        run: |
          npm run lint:web
          npm run typecheck:web
      - name: Frontend production build
        run: npm run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API
        run: python -m pip install -e "./apps/api[dev]"
      - name: One-time Stage 1 Python formatting
        run: |
          python -m ruff check --fix apps/api
          python -m ruff format apps/api
          python -m ruff check --fix apps/api
          if ! git diff --quiet -- apps/api; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api
            git commit -m "style(stage-1): format Python sources"
            git push origin HEAD:main
          fi
      - name: Start PostgreSQL and apply Stage 1 migrations
        env:
          POSTGRES_PASSWORD: validation-only-not-real
          DATABASE_URL: postgresql+psycopg://one_many:validation-only-not-real@127.0.0.1:5432/one_many
        run: |
          docker compose up -d --wait postgres
          cd apps/api
          python -m alembic upgrade head
          cd ../..
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://one_many:validation-only-not-real@127.0.0.1:5432/one_many") as connection:
              assert connection.execute("SELECT to_regclass('public.users')").fetchone()[0] == "users"
              assert connection.execute("SELECT to_regclass('public.needs')").fetchone()[0] == "needs"
              assert connection.execute("SELECT version_num FROM alembic_version").fetchone()[0] == "20261112_01"
          PY
          python - <<'PY'
          from fastapi.testclient import TestClient
          from one_many_api.config import Settings
          from one_many_api.main import create_app
          settings = Settings(
              _env_file=None,
              environment="test",
              auth_secret="CI-only-secret-test-value-with-at-least-32-characters",
              database_url="postgresql+psycopg://one_many:validation-only-not-real@127.0.0.1:5432/one_many",
          )
          with TestClient(create_app(settings)) as client:
              signed_up = client.post("/api/v1/auth/register", json={
                  "email": "postgres-smoke@example.com",
                  "display_name": "Database Smoke",
                  "password": "not-a-real-secret-password-123",
              })
              assert signed_up.status_code == 201, signed_up.text
              auth = {"Authorization": "Bearer " + signed_up.json()["access_token"]}
              saved = client.post("/api/v1/needs", headers=auth, json={
                  "request_text": "Need a projector for Friday evening workshop",
              })
              assert saved.status_code == 201, saved.text
              assert client.get("/api/v1/needs", headers=auth).json()["total"] == 1
          PY
      - name: API tests and lint
        run: |
          python -m pytest -q apps/api/tests
          python -m ruff check apps/api
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: validation-only-not-real
        run: docker compose config --quiet
      - name: Shut down test database
        if: always()
        env:
          POSTGRES_PASSWORD: validation-only-not-real
        run: docker compose down
