name: Verify ONE / MANY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Frontend lint and types
        run: |
          npm run lint:web
          npm run typecheck:web
      - name: Frontend production build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API
        run: python -m pip install -e "./apps/api[dev]"
      - name: Start PostgreSQL and apply Stage 6 migrations
        env:
          POSTGRES_PASSWORD: validation-only-not-real
          DATABASE_URL: postgresql+psycopg://one_many:validation-only-not-real@127.0.0.1:5432/one_many
        run: |
          docker compose up -d --wait postgres
          cd apps/api
          python -m alembic upgrade head
          cd ../..
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://one_many:validation-only-not-real@127.0.0.1:5432/one_many") as connection:
              assert connection.execute("SELECT to_regclass('public.users')").fetchone()[0] == "users"
              assert connection.execute("SELECT to_regclass('public.needs')").fetchone()[0] == "needs"
              assert connection.execute("SELECT version_num FROM alembic_version").fetchone()[0] == "20261112_06"
              assert connection.execute("SELECT to_regclass('public.need_intents')").fetchone()[0] == "need_intents"
              assert connection.execute("SELECT to_regclass('public.purchase_proposals')").fetchone()[0] == "purchase_proposals"
              for table in ("funding_groups", "funding_members", "payment_attempts", "paypal_webhook_events"):
                  assert connection.execute("SELECT to_regclass(%s)", (f"public.{table}",)).fetchone()[0] == table
              assert connection.execute("SELECT to_regclass('public.asset_reservations')").fetchone()[0] == "asset_reservations"
              assert connection.execute(
                  "SELECT to_regclass('public.funding_ledger_events')"
              ).fetchone()[0] == "funding_ledger_events"
              assert connection.execute(
                  "SELECT to_regclass('public.ix_funding_events_group_recorded')"
              ).fetchone()[0] == "ix_funding_events_group_recorded"
              assert connection.execute(
                  "SELECT 1 FROM pg_constraint WHERE conname = 'ex_reservations_no_overlap'"
              ).fetchone()[0] == 1
          PY
          python - <<'PY'
          from fastapi.testclient import TestClient
          from one_many_api.config import Settings
          from one_many_api.main import create_app
          settings = Settings(
              _env_file=None,
              environment="test",
              auth_secret="CI-only-secret-test-value-with-at-least-32-characters",
              database_url="postgresql+psycopg://one_many:validation-only-not-real@127.0.0.1:5432/one_many",
          )
          with TestClient(create_app(settings)) as client:
              signed_up = client.post("/api/v1/auth/register", json={
                  "email": "postgres-smoke@example.com",
                  "display_name": "Database Smoke",
                  "password": "not-a-real-secret-password-123",
              })
              assert signed_up.status_code == 201, signed_up.text
              auth = {"Authorization": "Bearer " + signed_up.json()["access_token"]}
              saved = client.post("/api/v1/needs", headers=auth, json={
                  "request_text": "Need a projector for Friday evening workshop",
              })
              assert saved.status_code == 201, saved.text
              assert client.get("/api/v1/needs", headers=auth).json()["total"] == 1
              from unittest.mock import patch
              from one_many_api.ai_service import AIIntent
              consent = client.patch(
                  "/api/v1/needs/" + saved.json()["id"], headers=auth,
                  json={"discoverable": True},
              )
              assert consent.status_code == 200, consent.text
              second = client.post("/api/v1/auth/register", json={
                  "email": "postgres-peer@example.com",
                  "display_name": "Postgres Peer",
                  "password": "not-a-real-secret-password-123",
              })
              assert second.status_code == 201, second.text
              peer_auth = {"Authorization": "Bearer " + second.json()["access_token"]}
              peer_need = client.post("/api/v1/needs", headers=peer_auth, json={
                  "request_text": "Borrow a projector for a community session",
                  "location_label": "Downtown, Pune",
                  "discoverable": True,
                  "needed_from": "2026-11-20",
                  "needed_until": "2026-11-21",
              })
              assert peer_need.status_code == 201, peer_need.text
              # The original need has no area; update it to match, preserving privacy.
              assert client.patch("/api/v1/needs/" + saved.json()["id"], headers=auth, json={
                  "location_label": "Downtown, Pune",
                  "needed_from": "2026-11-17",
                  "needed_until": "2026-11-18",
              }).status_code == 200
              # A deterministic model fixture is used only in CI (never in production).
              def model_fixture(text, settings):
                  return AIIntent(
                      asset_type="projector", purpose="Project a presentation",
                      required_features=[], excluded_features=[], shareable=True,
                  )
              with patch("one_many_api.discovery_routes.extract_intent", side_effect=model_fixture):
                  for identity, identifier in [(auth, saved.json()["id"]), (peer_auth, peer_need.json()["id"])]:
                      analysis = client.post("/api/v1/needs/" + identifier + "/analyze", headers=identity)
                      assert analysis.status_code == 200, analysis.text
              match = client.get("/api/v1/needs/" + saved.json()["id"] + "/matches", headers=auth)
              assert match.status_code == 200, match.text
              assert match.json()["potential_members"] == 1, match.text
              assert "postgres-peer@example.com" not in match.text
              # Stage 3: provider response fixtures are TEST-ONLY; production never uses them.
              from one_many_api.channel3 import normalize_product
              raw_product = {
                  "id": "ci-sample-projector",
                  "title": "Portable projector",
                  "images": [{"url": "https://images.example.test/projector.jpg"}],
                  "offers": [{
                      "url": "https://shop.example.test/projector",
                      "domain": "shop.example.test",
                      "price": {"price": 97.01, "currency": "USD"},
                      "availability": "InStock",
                  }],
              }
              with patch("one_many_api.catalog_routes.Channel3Client.product") as product_detail:
                  product_detail.return_value = normalize_product(raw_product, "USD", [], [])
                  draft = client.post("/api/v1/needs/" + saved.json()["id"] + "/proposals",
                      headers=auth, json={
                          "product_id": "ci-sample-projector",
                          "offer_url": "https://shop.example.test/projector",
                      })
              assert draft.status_code == 201, draft.text
              assert draft.json()["member_shares_minor"] == [4851, 4850]
              assert draft.json()["price_minor"] == 9701
              assert client.get("/api/v1/proposals", headers=auth).json()["proposals"][0]["id"] == draft.json()["id"]
              assert client.get("/api/v1/proposals", headers=peer_auth).json()["proposals"] == []
              # Stage 4 uses PostgreSQL for real persistence; provider is test-only fixture.
              from one_many_api.paypal import PayPalSandboxClient
              with patch("one_many_api.funding_routes.Channel3Client.product") as detail:
                  detail.return_value = normalize_product(raw_product, "USD", [], [])
                  opened = client.post(
                      "/api/v1/proposals/" + draft.json()["id"] + "/funding-group", headers=auth
                  )
              assert opened.status_code == 201, opened.text
              gid = opened.json()["group"]["id"]
              assert opened.json()["group"]["state"] == "recruiting"
              joined = client.post("/api/v1/funding/join", headers=peer_auth, json={
                  "invite_code": opened.json()["invite_code"],
                  "need_id": peer_need.json()["id"],
              })
              assert joined.status_code == 200, joined.text
              assert joined.json()["state"] == "funding"
              with patch("one_many_api.funding_routes.Channel3Client.product") as detail:
                  detail.return_value = normalize_product(raw_product, "USD", [], [])
                  with patch.object(PayPalSandboxClient, "create_order") as checkout:
                      checkout.return_value = (
                          "CISANDBOXORDER12345",
                          "https://www.sandbox.paypal.com/checkoutnow?token=CISANDBOXORDER12345",
                      )
                      order = client.post(
                          "/api/v1/funding/groups/" + gid + "/paypal-order", headers=auth
                      )
              assert order.status_code == 200, order.text
              assert order.json()["amount_minor"] == 4851
              ledger = client.get("/api/v1/funding/groups/" + gid, headers=auth)
              assert ledger.status_code == 200, ledger.text
              assert ledger.json()["captured_minor"] == 0
              assert ledger.json()["members"][0]["payment_state"] == "awaiting_approval"
              # Stage 5 fixture: mimic confirmed sandbox captures inside CI only.
              from uuid import UUID
              from sqlalchemy import create_engine, select
              from sqlalchemy.orm import Session
              from one_many_api.models import FundingGroup, FundingMember, PaymentAttempt
              from one_many_api.models import User as DBUser, AssetReservation
              engine = create_engine("postgresql+psycopg://one_many:validation-only-not-real@127.0.0.1:5432/one_many")
              with Session(engine) as db:
                  group = db.get(FundingGroup, UUID(gid))
                  members = db.scalars(
                      select(FundingMember).where(FundingMember.group_id == group.id)
                      .order_by(FundingMember.slot_index)
                  ).all()
                  assert len(members) == 2
                  for m in members:
                      attempt = db.scalar(select(PaymentAttempt).where(
                          PaymentAttempt.group_id == gid, PaymentAttempt.user_id == m.user_id
                      ))
                      if attempt is None:
                          attempt = PaymentAttempt(
                              group_id=group.id, user_id=m.user_id,
                              amount_minor=m.share_minor, currency=group.currency,
                              paypal_order_id="CIFIXTUREORDER" + str(m.slot_index) + "123456",
                          )
                          db.add(attempt)
                      attempt.state = "completed"
                      attempt.paypal_capture_id = "CIFIXTURECAPTURE" + str(m.slot_index) + "12345"
                  group.state = "funded"
                  db.commit()
              reserve_path = "/api/v1/funding/groups/" + gid + "/reservation"
              reserved = client.put(reserve_path, headers=auth, json={
                  "start_date": "2026-11-17",
                  "end_date": "2026-11-18",
                  "expected_version": 0,
              })
              assert reserved.status_code == 200, reserved.text
              other = client.put(reserve_path, headers=peer_auth, json={
                  "start_date": "2026-11-20",
                  "end_date": "2026-11-21",
                  "expected_version": 0,
              })
              assert other.status_code == 200, other.text
              assert len(other.json()["reservations"]) == 2
              assert other.json()["reservations"][0]["is_you"] is False
              assert other.json()["reservations"][1]["is_you"] is True
              assert client.get(reserve_path + "s", headers=auth).json()["bookable"] is True
              # Database-level concurrency backstop: a forged third user cannot
              # insert an active booking overlapping the first reservation.
              from uuid import uuid4
              rogue = client.post("/api/v1/auth/register", json={
                  "email": "pg-overlap-rogue@example.com", "display_name": "Rogue CI",
                  "password": "not-a-real-secret-password-123",
              })
              assert rogue.status_code == 201, rogue.text
              with Session(engine) as db:
                  rogue_user = db.scalar(select(DBUser).where(
                      DBUser.email == "pg-overlap-rogue@example.com"
                  ))
                  db.add(AssetReservation(
                      group_id=UUID(gid), user_id=rogue_user.id,
                      need_id=UUID(saved.json()["id"]), status="active",
                      start_date=__import__("datetime").date(2026, 11, 18),
                      end_date=__import__("datetime").date(2026, 11, 19),
                  ))
                  try:
                      db.commit()
                  except Exception as ex:
                      assert getattr(getattr(ex, "orig", None), "sqlstate", "") == "23P01", str(ex)
                      db.rollback()
                  else:
                      raise AssertionError("PostgreSQL must reject overlapping reservations")
              # Stage 6: read the REAL PostgreSQL ledger snapshot from earlier
              # joined/recorded test funding, not fabricated application data.
              ledger = client.get(
                  "/api/v1/funding/groups/" + gid + "/ledger", headers=peer_auth
              )
              assert ledger.status_code == 200, ledger.text
              snapshot = ledger.json()
              assert snapshot["captured_minor"] == 9701
              assert snapshot["outstanding_minor"] == 0
              assert snapshot["total_minor"] == 9701
              assert snapshot["verified_members"] == 2
              assert snapshot["reconciliation"] == "reconciled"
              assert [row["slot"] for row in snapshot["members"]] == [1, 2]
              assert len(snapshot["events"]) >= 3
              assert {item["event_type"] for item in snapshot["events"]} >= {
                  "group_created", "member_joined", "order_created",
              }
              assert "paypal_capture_id" not in ledger.text
              assert "paypal_order_id" not in ledger.text
              assert client.get(
                  "/api/v1/funding/groups/" + gid + "/ledger", headers={
                      "Authorization": "Bearer invalid",
                  },
              ).status_code == 401
              engine.dispose()


          PY
      - name: API tests and lint
        run: |
          python -m pytest -q apps/api/tests
          python -m ruff check apps/api
      - name: Real Chromium end-to-end smoke
        env:
          E2E_DATABASE_URL: postgresql+psycopg://one_many:validation-only-not-real@127.0.0.1:5432/one_many
        run: |
          npm install --prefix apps/web/e2e --no-audit --no-fund
          cd apps/web/e2e
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-many-stage7-browser-evidence
          path: |
            apps/web/e2e/test-results/
            apps/web/e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: validation-only-not-real
        run: docker compose config --quiet
      - name: Shut down test database
        if: always()
        env:
          POSTGRES_PASSWORD: validation-only-not-real
        run: docker compose down
